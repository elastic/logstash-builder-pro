name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE_NAME: services-logstash-builder
  PROJECT_ID: elastic-consulting-prod
  REGION: us-east1
  REGISTRY: us-east1-docker.pkg.dev/elastic-consulting-prod/services-engineering

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            us-east1-docker.pkg.dev/elastic-consulting-prod/services-engineering/services-logstash-builder:${{ github.sha }}
            us-east1-docker.pkg.dev/elastic-consulting-prod/services-engineering/services-logstash-builder:latest
          cache-from: type=registry,ref=us-east1-docker.pkg.dev/elastic-consulting-prod/services-engineering/services-logstash-builder:latest
          cache-to: type=inline

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: services-logstash-builder
          region: us-east1
          image: us-east1-docker.pkg.dev/elastic-consulting-prod/services-engineering/services-logstash-builder:${{ github.sha }}
          flags: |
            --execution-environment gen2
            --port 8080
            --memory 4Gi
            --cpu 2
            --max-instances 3
            --min-instances 0
            --timeout 900
            --session-affinity

      - name: Output service URL
        run: |
          echo "Deployed to: $(gcloud run services describe services-logstash-builder --region us-east1 --format 'value(status.url)')"
